#name: Build APKs
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: customer_app
            label: GetGrocery
          - app: delivery_app
            label: GetGrocery Delivery
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q getgrocery.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          cd getgrocery/${{ matrix.app }}
          flutter create . --platforms=android --org com.getgrocery
          sed -i 's/android:label="[^"]*"/android:label="${{ matrix.label }}"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: getgrocery/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
